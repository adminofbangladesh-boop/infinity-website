
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: #f8fafc;
    }
    .login {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #111827;
      border: 1px solid #30394a;
      border-radius: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { color: #aab4c5; margin-bottom: 25px; }
    label { display: block; margin: 16px 0 8px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #414c60;
      border-radius: 8px;
      background: #080d18;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    .note { font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="login">
    <h1>Welcome Back</h1>
    <p>Sign in to your account</p>
    <form id="loginForm">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="Enter your email" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required>
      <button type="submit">Sign In</button>
    </form>
    <p class="note">Demo interface only. Login is not connected to an account database yet.</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('This is a demo. Account login is not set up yet.');
    });
  </script>
</body>
</html>
