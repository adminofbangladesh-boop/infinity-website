
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFINITY Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fb;color:#19243a;font-family:Arial,sans-serif}
header{background:#111d39;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0}
button{border:0;border-radius:9px;padding:12px 15px;background:#2463eb;color:white;cursor:pointer;font-weight:600}
input,select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:9px;margin:7px 0 15px}
.wrap{max-width:1050px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #162b4d0c}
nav{display:flex;gap:8px;overflow:auto;background:white;padding:12px}
nav button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.tile{background:white;border:1px solid #e4e9f2;border-radius:12px;padding:16px}
.hero{padding:25px;border-radius:15px;background:linear-gradient(120deg,#172c59,#2874f0);color:white}
.small{color:#718096;font-size:13px}
.notice{padding:12px;background:#edf4ff;border-radius:9px;white-space:pre-wrap;margin:10px 0}
.hidden{display:none!important}
.danger{background:#c83343}
</style>
</head>
<body>
<header>
  <h2>♾ INFINITY</h2>
  <button id="logoutBtn" class="hidden" onclick="logout()">লগআউট</button>
</header>

<div class="wrap">
  <section id="login">
    <div class="card">
      <h2>Welcome Back</h2>
      <p class="small">INFINITY অ্যাকাউন্টে লগইন করুন</p>
      <label>ইমেইল</label>
      <input id="email" type="email" placeholder="Email address">
      <label>পাসওয়ার্ড</label>
      <input id="password" type="password" placeholder="Password">
      <button onclick="signIn()">লগইন</button>
      <button onclick="signUp()">নতুন অ্যাকাউন্ট</button>
      <div id="authMsg" class="notice hidden"></div>
    </div>
  </section>

  <section id="portal" class="hidden">
    <nav>
      <button onclick="page('home')">ড্যাশবোর্ড</button>
      <button onclick="page('services')">সার্ভিস</button>
      <button onclick="page('wallet')">ওয়ালেট</button>
      <button onclick="page('history')">পেমেন্ট হিস্ট্রি</button>
      <button id="adminBtn" class="hidden" onclick="page('admin')">অ্যাডমিন</button>
    </nav>
    <main id="view"></main>
  </section>
</div>

<script>
const DB_URL="https://ozjmdxufgugemtggkuvp.supabase.co";
const DB_KEY="sb_publishable_gvxxNZqQAzaJagj34FgjRA_kUW6Y-Xg";
const db=window.supabase.createClient(DB_URL,DB_KEY);

let user=null;
let admin=false;

/* আপনার আসল পেমেন্ট নম্বর এখানে বসাবেন */
const RECEIVERS={
  bKash:"এখানে আপনার bKash নম্বর দিন",
  Nagad:"এখানে আপনার Nagad নম্বর দিন",
  Rocket:"এখানে আপনার Rocket নম্বর দিন"
};

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function msg(id,text){
  $(id).textContent=text;
  $(id).classList.remove("hidden");
}

async function signIn(){
  const {error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error)msg("authMsg",error.message);
}

async function signUp(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(password.length<6){
    msg("authMsg","পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;
  }
  const {data,error}=await db.auth.signUp({email,password});
  if(error){msg("authMsg",error.message);return}
  if(!data.session){
    msg("authMsg","অ্যাকাউন্ট তৈরি হয়েছে। প্রয়োজন হলে ইমেইল ভেরিফাই করুন।");
  }
}

async function logout(){await db.auth.signOut()}

async function initialize(session){
  user=session?.user||null;
  $("login").classList.toggle("hidden",!!user);
  $("portal").classList.toggle("hidden",!user);
  $("logoutBtn").classList.toggle("hidden",!user);

  if(!user){admin=false;return}

  const {data}=await db.from("infinity_admins")
    .select("user_id").eq("user_id",user.id).maybeSingle();

  admin=!!data;
  $("adminBtn").classList.toggle("hidden",!admin);
  await page("home");
}

async function page(name){
  const v=$("view");
  v.innerHTML='<div class="card">লোড হচ্ছে...</div>';

  if(name==="home"){
    const {data,error}=await db.from("wallet_accounts")
      .select("balance").eq("user_id",user.id).maybeSingle();

    v.innerHTML=`
      <div class="hero">
        <h2>স্বাগতম, INFINITY</h2>
        <p>${esc(user.email)}</p>
        <p>আপনার সার্ভিস ড্যাশবোর্ড</p>
      </div>
      <div class="grid">
        <div class="tile"><h3>ওয়ালেট ব্যালেন্স</h3>
          <h2>৳ ${Number(data?.balance||0).toFixed(2)}</h2>
        </div>
        <div class="tile"><h3>পেমেন্ট</h3>
          <p>TrxID দিয়ে পেমেন্ট জমা দিন।</p>
        </div>
      </div>
      <div class="card">
        <h3>দ্রুত অ্যাক্সেস</h3>
        <button onclick="page('services')">সার্ভিস দেখুন</button>
        <button onclick="page('wallet')">টাকা যোগ করুন</button>
      </div>`;
    if(error) v.insertAdjacentHTML("beforeend",
      '<div class="notice">ওয়ালেট টেবিল সেটআপ করা হয়নি। নিচের SQL চালান।</div>');
  }

  else if(name==="services"){
    const items=[
      ["জন্ম নিবন্ধন","জন্ম নিবন্ধন-সংক্রান্ত সেবা"],
      ["NID সেবা","NID-সংক্রান্ত সহায়তা"],
      ["TIN সেবা","TIN-সংক্রান্ত সহায়তা"],
      ["অন্যান্য সেবা","অনলাইন সার্ভিস সহায়তা"]
    ];
    v.innerHTML=`<div class="card"><h2>সার্ভিসসমূহ</h2>
      <div class="grid">${items.map(x=>`
        <div class="tile"><h3>${esc(x[0])}</h3>
          <p>${esc(x[1])}</p>
          <button onclick="alert('এই সার্ভিসের জন্য অ্যাডমিনের সঙ্গে যোগাযোগ করুন।')">বিস্তারিত</button>
        </div>`).join("")}
      </div></div>`;
  }

  else if(name==="wallet"){
    v.innerHTML=`<div class="card">
      <h2>ওয়ালেটে টাকা যোগ করুন</h2>
      <p class="small">টাকা পাঠানোর পর TrxID জমা দিন। অ্যাডমিন যাচাই না করা পর্যন্ত ব্যালেন্স যোগ হবে না।</p>
      <label>পেমেন্ট মাধ্যম</label>
      <select id="method" onchange="receiver()">
        <option>bKash</option><option>Nagad</option><option>Rocket</option>
      </select>
      <div id="receiverText" class="notice">${esc(RECEIVERS.bKash)}</div>
      <label>যে নম্বর থেকে পাঠিয়েছেন</label>
      <input id="sender" inputmode="tel" placeholder="মোবাইল নম্বর">
      <label>পরিমাণ (টাকা)</label>
      <input id="amount" type="number" min="1" max="100000" placeholder="500">
      <label>Transaction ID (TrxID)</label>
      <input id="trxid" maxlength="100" placeholder="TrxID">
      <button onclick="submitPayment()">পেমেন্ট জমা দিন</button>
      <div id="paymentMsg" class="notice hidden"></div>
    </div>`;
  }

  else if(name==="history"){
    const {data,error}=await db.from("payment_requests")
      .select("id,method,amount,trxid,status,created_at")
      .eq("user_id",user.id).order("created_at",{ascending:false}).limit(50);

    if(error){
      v.innerHTML=`<div class="card">তথ্য পাওয়া যায়নি: ${esc(error.message)}</div>`;
      return;
    }
    v.innerHTML=`<div class="card"><h2>পেমেন্ট হিস্ট্রি</h2>
      ${!data?.length?"<p>কোনো পেমেন্ট নেই।":data.map(p=>`
        <div class="tile">
          <b>৳ ${Number(p.amount).toFixed(2)}</b>
          <p>মাধ্যম: ${esc(p.method)}</p>
          <p>TrxID: ${esc(p.trxid)}</p>
          <p>অবস্থা: ${esc(p.status)}</p>
          <p class="small">${esc(p.created_at)}</p>
        </div><br>`).join("")}
    </div>`;
  }

  else if(name==="admin"){
    if(!admin){v.innerHTML='<div class="card">অনুমতি নেই।</div>';return}

    const {data,error}=await db.from("payment_requests")
      .select("id,user_id,method,sender,amount,trxid,created_at")
      .eq("status","pending").order("created_at").limit(100);

    if(error){
      v.innerHTML=`<div class="card">ত্রুটি: ${esc(error.message)}</div>`;
      return;
    }
    v.innerHTML=`<div class="card"><h2>অপেক্ষমাণ পেমেন্ট</h2>
      ${!data?.length?"<p>কোনো পেমেন্ট অপেক্ষমাণ নেই।":data.map(p=>`
      <div class="tile">
        <p>ইউজার: ${esc(p.user_id)}</p>
        <p>মাধ্যম: ${esc(p.method)}</p>
        <p>প্রেরকের নম্বর: ${esc(p.sender)}</p>
        <p>পরিমাণ: ৳ ${Number(p.amount).toFixed(2)}</p>
        <p>TrxID: ${esc(p.trxid)}</p>
        <button onclick="review('${esc(p.id)}','approved')">অনুমোদন</button>
        <button class="danger" onclick="review('${esc(p.id)}','rejected')">বাতিল</button>
      </div><br>`).join("")}
    </div>`;
  }
}

function receiver(){
  $("receiverText").textContent=RECEIVERS[$("method").value];
}

async function submitPayment(){
  const method=$("method").value;
  const sender=$("sender").value.trim();
  const amount=Number($("amount").value);
  const trxid=$("trxid").value.trim();

  if(!sender||!trxid||!Number.isFinite(amount)||amount<1||amount>100000){
    msg("paymentMsg","সঠিক নম্বর, পরিমাণ ও TrxID দিন।");
    return;
  }

  const {error}=await db.from("payment_requests").insert({
    user_id:user.id,method,sender,amount,trxid,status:"pending"
  });

  if(error){msg("paymentMsg","জমা হয়নি: "+error.message);return}
  msg("paymentMsg","পেমেন্ট অনুরোধ জমা হয়েছে। যাচাইয়ের জন্য অপেক্ষা করুন।");
  $("sender").value="";
  $("amount").value="";
  $("trxid").value="";
}

async function review(id,status){
  if(!admin)return;
  if(!confirm(status==="approved"?"পেমেন্ট অনুমোদন করবেন?":"পেমেন্ট বাতিল করবেন?"))return;

  const {error}=await db.from("payment_requests")
    .update({status}).eq("id",id).eq("status","pending");

  if(error){alert("ব্যর্থ: "+error.message);return}
  alert("অনুরোধ আপডেট হয়েছে।");
  await page("admin");
}

db.auth.onAuthStateChange((_event,session)=>{
  setTimeout(()=>initialize(session),0);
});

(async()=>{
  const {data}=await db.auth.getSession();
  await initialize(data.session);
})();
</script>
</body>
</html>
